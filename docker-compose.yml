# Full local stack:  docker compose up --build   ->  http://localhost:8080
#
#   edge (nginx LB :8080) ─► frontend (static SPA)
#                        └─► api x2 (Rust) ─► postgres, redis
#                                         └─► anvil (EVM) + ClaimLedger contract, IPFS (kubo)
#
# Secrets come from .env (copy .env.example and run `make secrets`).

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.4-alpine
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    <<: *hardening
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    read_only: true
    volumes: ["./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    <<: *hardening
    user: "0:0"   # local dev chain only: lets anvil persist state to the fresh named volume
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--state", "/home/foundry/state/anvil.json"]
    volumes: [anvil:/home/foundry/state]
    networks: [chain]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 3s
      retries: 30

  contracts:
    build: ./blockchain
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: "no"
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYER_PRIVATE_KEY: ${CHAIN_DEPLOYER_PRIVATE_KEY:?set CHAIN_DEPLOYER_PRIVATE_KEY in .env}
      WRITER_ADDRESS: ${CHAIN_WRITER_ADDRESS:?set CHAIN_WRITER_ADDRESS in .env}
      DEPLOYMENT_FILE: /shared/deployment.json
    volumes: [shared:/shared]
    networks: [chain]
    depends_on:
      anvil: { condition: service_healthy }

  ipfs:
    image: ipfs/kubo:v0.34.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      IPFS_PROFILE: server
    volumes: [ipfs:/data/ipfs]
    ports: ["127.0.0.1:8081:8080"]   # read-only gateway for viewing pinned bundles
    networks: [chain]

  api:
    build: ./backend
    <<: *hardening
    read_only: true
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }
    environment:
      APP_ENV: production
      RUST_LOG: info
      DATABASE_URL: postgres://claims:${POSTGRES_PASSWORD}@postgres:5432/claims
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-lite}
      CHAIN_ENABLED: "true"
      CHAIN_RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      CHAIN_PRIVATE_KEY: ${CHAIN_WRITER_PRIVATE_KEY:?set CHAIN_WRITER_PRIVATE_KEY in .env}
      CHAIN_DEPLOYMENT_FILE: /shared/deployment.json
      IPFS_ENABLED: "true"
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://localhost:8081
    volumes: [shared:/shared:ro]
    networks: [edge, data, chain]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      contracts: { condition: service_completed_successfully }
      ipfs: { condition: service_started }

  frontend:
    build: ./frontend
    <<: *hardening
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [edge]

  edge:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    ports: ["8080:8080"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_api.conf:/etc/nginx/proxy_api.conf:ro
    networks: [edge]
    depends_on: [api, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/edge-health || exit 1"]
      interval: 10s
      timeout: 3s

networks:
  edge: {}
  data:
    internal: true   # postgres and redis are unreachable from outside the stack
  chain: {}

volumes:
  pgdata: {}
  anvil: {}
  ipfs: {}
  shared: {}
