[package]
name = "claim-api"
description = "HTTP API for the Claim Analyst Agent Workflow: auth, persistence, caching, rate limiting, tamper-evident ledger with blockchain anchoring"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "claim-api"
path = "src/main.rs"

[dependencies]
claim-engine = { path = "../engine" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "request-id", "set-header", "limit", "timeout", "sensitive-headers", "catch-panic"] }
http = "1"

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }

argon2 = "0.6"
jsonwebtoken = "11"
aes-gcm = "0.11"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
rand = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
alloy = { version = "2", default-features = false, features = ["std", "essentials", "reqwest-rustls-tls"] }
url = "2"
time = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
