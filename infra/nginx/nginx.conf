# Edge reverse proxy and load balancer for docker-compose.
#
#   client ──► edge (this) ──► /        frontend (static SPA)
#                         └──► /api/*   api replicas (least connections)
#
# One public origin for app and API: cookies stay SameSite=Strict, no CORS needed.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s upstream=$upstream_addr rid=$request_id';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512k;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Docker's embedded DNS: re-resolve so scaled replicas join the pool.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Coarse edge rate limits (fine-grained per-user limits live in the API, backed by Redis).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Micro-cache for the static policy wording (authenticated, so keyed per session cookie).
    proxy_cache_path /tmp/cache levels=1:2 keys_zone=policy:10m max_size=50m inactive=10m use_temp_path=off;

    upstream api_pool {
        least_conn;
        zone api_pool 64k;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web {
        zone web 64k;
        server frontend:8080 resolve;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    server {
        listen 8080;
        server_name _;
        limit_conn perip 50;

        add_header X-Request-Id $request_id always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location = /edge-health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/proxy_api.conf;
        }

        location /api/policy/ {
            limit_req zone=api burst=40 nodelay;
            proxy_cache policy;
            proxy_cache_key "$request_uri$cookie_caw_access";
            proxy_cache_valid 200 5m;
            # The API marks policy text "private"; it is cached here per session cookie only.
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_use_stale error timeout updating;
            add_header X-Edge-Cache $upstream_cache_status always;
            include /etc/nginx/proxy_api.conf;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/proxy_api.conf;
        }

        # Health and metrics stay internal.
        location ~ ^/(healthz|readyz|metrics)$ {
            return 404;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
