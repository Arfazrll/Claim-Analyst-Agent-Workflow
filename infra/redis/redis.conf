# Redis for cache, rate-limit counters, idempotency keys and the anchor-worker lease.
# The password is passed on the command line from REDIS_PASSWORD (never committed).
bind 0.0.0.0
protected-mode yes
port 6379

# Cache semantics: bounded memory, evict least-recently-used keys with a TTL first.
maxmemory 256mb
maxmemory-policy volatile-lru

# Data here is reconstructible (cache / counters), so no persistence.
save ""
appendonly no

# Disable commands that could wipe or reconfigure the instance from a compromised client.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

timeout 300
tcp-keepalive 60
loglevel notice
