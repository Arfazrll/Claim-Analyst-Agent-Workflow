# ingress-nginx in front of both Services: one origin for the SPA and /api, TLS via
# cert-manager, edge rate limiting and security headers. The controller load-balances
# across Service endpoints (pod IPs), so HPA-added replicas join automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claim-desk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 512k
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/load-balance: ewma
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [claims.example.com]
      secretName: claim-desk-tls
  rules:
    - host: claims.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: claim-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: claim-web, port: { name: http } } }
