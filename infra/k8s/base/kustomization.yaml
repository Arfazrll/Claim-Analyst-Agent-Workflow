apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claim-desk
labels:
  - pairs:
      app.kubernetes.io/part-of: claim-desk
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - postgres.yaml
  - redis.yaml
  - ipfs.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: claim-api
    newName: ghcr.io/OWNER/claim-analyst-api
    newTag: latest
  - name: claim-web
    newName: ghcr.io/OWNER/claim-analyst-web
    newTag: latest
