# Non-secret settings. Secrets (claim-desk-secrets) are generated by the overlay from a
# local, uncommitted secrets.env — or better, synced by External Secrets / Sealed Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-desk-config
data:
  APP_ENV: production
  RUST_LOG: info
  BIND_ADDR: 0.0.0.0:8000
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  ALLOW_REGISTRATION: "true"
  CORS_ORIGINS: https://claims.example.com
  RATE_LIMIT_AUTH_PER_MIN: "10"
  RATE_LIMIT_ANALYZE_PER_MIN: "30"
  RATE_LIMIT_API_PER_MIN: "300"
  CACHE_TTL_SECS: "3600"
  LLM_PROVIDER: offline
  CHAIN_ENABLED: "true"
  CHAIN_RPC_URL: http://anvil:8545
  CHAIN_ID: "31337"
  CHAIN_CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  IPFS_ENABLED: "true"
  IPFS_API_URL: http://ipfs:5001
  IPFS_GATEWAY_URL: https://ipfs.io
  ANCHOR_INTERVAL_SECS: "5"
